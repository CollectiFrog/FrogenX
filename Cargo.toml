[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/osc",
    "crates/shape",
    "crates/composition",
    "crates/layer",
    "crates/render",
]

# Versions communes à toutes les crates (voir rust-workspace).
# Chaque crate référence `dep.workspace = true` — évite les versions
# divergentes de glam ou wgpu, qui produisent des erreurs de types
# incompréhensibles entre crates.
[workspace.dependencies]
frogenx-core = { path = "crates/core" }
frogenx-osc = { path = "crates/osc" }
frogenx-shape = { path = "crates/shape" }
frogenx-composition = { path = "crates/composition" }
frogenx-layer = { path = "crates/layer" }
frogenx-render = { path = "crates/render" }
glam = "0.29"
serde = { version = "1", features = ["derive"] }
# Majeure épinglée (§11) : wgpu change d'API à chaque majeure. Monter de
# version est un commit délibéré, jamais l'effet d'un `cargo update`.
wgpu = "30"
lyon_tessellation = "1.0"
bytemuck = { version = "1", features = ["derive"] }
pollster = "1"
png = "0.18"

[workspace.package]
version = "0.1.0"
edition = "2021"
# Minimum de wgpu 30 (docs/ARCHITECTURE.md §11) : relevé avec la majeure de wgpu.
rust-version = "1.87"
license = "MIT OR Apache-2.0"

[profile.release]
lto = "thin"
codegen-units = 1
