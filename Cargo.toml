[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/osc",
    "crates/shape",
    "crates/composition",
    "crates/audio",
    "crates/library",
    "crates/patch",
    "crates/layer",
    "crates/render",
    "crates/output",
    "crates/ui",
    "crates/app",
]

# Versions communes à toutes les crates (voir rust-workspace).
# Chaque crate référence `dep.workspace = true` — évite les versions
# divergentes de glam ou wgpu, qui produisent des erreurs de types
# incompréhensibles entre crates.
[workspace.dependencies]
frogenx-core = { path = "crates/core" }
frogenx-osc = { path = "crates/osc" }
frogenx-shape = { path = "crates/shape" }
frogenx-composition = { path = "crates/composition" }
frogenx-audio = { path = "crates/audio" }
frogenx-library = { path = "crates/library" }
frogenx-patch = { path = "crates/patch" }
frogenx-layer = { path = "crates/layer" }
frogenx-render = { path = "crates/render" }
frogenx-output = { path = "crates/output" }
frogenx-ui = { path = "crates/ui" }
frogenx-app = { path = "crates/app" }
glam = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Majeure épinglée (§11) : wgpu change d'API à chaque majeure. Monter de
# version est un commit délibéré, jamais l'effet d'un `cargo update`.
wgpu = "30"
lyon_tessellation = "1.0"
bytemuck = { version = "1", features = ["derive"] }
pollster = "1"
png = "0.18"
# Imposé par `egui-wgpu` pour wgpu 30 (§11) ; dans `app` seulement (§8.3).
winit = "0.30"
# Interface (§23.5) : `egui` dans `ui`, les deux intégrations dans `app`.
egui = { version = "0.37", features = ["default_fonts"] }
egui-wgpu = "0.37"
egui-winit = "0.37"
egui_kittest = "0.37"
# Boîtes de fichiers du système (§23.8), dans `app` seulement.
rfd = "0.17"
# Audio (§7) : capture, FFT, et le passage lock-free entre les trois threads.
cpal = "0.18"
rustfft = "6"
rtrb = "0.4"
triple_buffer = "9"

[workspace.package]
version = "0.1.0"
edition = "2021"
# Minimum d'egui 0.37, qui dépasse celui de wgpu 30 (docs/ARCHITECTURE.md §11).
rust-version = "1.95"
license = "AGPL-3.0-or-later"

[profile.release]
lto = "thin"
codegen-units = 1
