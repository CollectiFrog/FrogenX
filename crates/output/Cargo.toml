[package]
name = "frogenx-output"
description = "Sorties : GpuSink, CpuSink, étage Outputs, passe de conversion 8 bits sRGB"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# Consomme la texture finale du compositeur (§8, §10). Ne connaît pas `winit` :
# c'est `app` qui possède la fenêtre (§8.3). La politique de perte (`fanout`) ne
# touche pas au GPU et se teste sans adaptateur.
[dependencies]
frogenx-layer.workspace = true
frogenx-render.workspace = true
wgpu.workspace = true

[target.'cfg(windows)'.dependencies.windows]
workspace = true
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
]

[dev-dependencies]
png.workspace = true
