[package]
name = "frogenx-app"
description = "Engine : la boucle de frame du §20.1, sans fenêtre"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
default-run = "frogenx"

# Sommet de la chaîne (§8.3). `src/lib.rs` (`Engine`) ne connaît pas `winit` :
# seul le binaire possède la fenêtre. C'est le seul binaire du workspace, donc
# ce que lance `cargo run` depuis la racine.
[[bin]]
name = "frogenx"
path = "src/main.rs"

[dependencies]
frogenx-core.workspace = true
frogenx-composition.workspace = true
frogenx-layer.workspace = true
frogenx-render.workspace = true
frogenx-output.workspace = true
frogenx-osc.workspace = true
frogenx-shape.workspace = true
glam.workspace = true
wgpu.workspace = true
winit.workspace = true
